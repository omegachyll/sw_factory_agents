[project]
name = "sw-factory"
version = "0.1.0"
description = "A self-improving software factory: AI agents that triage, spec, implement and review GitHub issues in the repo you run it from."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Ajay Gowda" }]
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.168",
    "pyyaml>=6.0.3",
    "typer>=0.12",
]

[project.scripts]
factory = "sw_factory.cli:app"

[project.optional-dependencies]
copilot = [
    "github-copilot-sdk>=1.0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src/sw_factory"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
